{% block javascript %}
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const tooltip = document.getElementById('tooltip-container');
        const entries = document.querySelectorAll('.journal-entry');

        entries.forEach(entry => {
            entry.addEventListener('mouseenter', function(e) {
                const content = this.getAttribute('data-tooltip');
                if (!content) return;

                tooltip.innerHTML = content;
                tooltip.classList.add('visible');
            });

            entry.addEventListener('mousemove', function(e) {
                // Posiziona il tooltip vicino al cursore
                const padding = 15;
                let x = e.clientX + padding;
                let y = e.clientY + padding;

                // Controllo bordi schermo (per non far uscire il tooltip a destra o in basso)
                if (x + 250 > window.innerWidth) x = e.clientX - 260;
                if (y + 150 > window.innerHeight) y = e.clientY - 160;

                tooltip.style.left = x + 'px';
                tooltip.style.top = y + 'px';
            });

            entry.addEventListener('mouseleave', function() {
                tooltip.classList.remove('visible');
            });
        });
    });
</script>
{% endblock %}
